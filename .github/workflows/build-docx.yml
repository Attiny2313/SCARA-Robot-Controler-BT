name: Build technical DOCX

on:
  push:
    branches: [main]
    paths:
      - 'docs/DOKUMENTACJA_TECHNICZNA_PL.md'
      - 'docs/DOKUMENTACJA_TECHNICZNA_UA.md'
      - 'tools/build_docx.py'
      - '.github/workflows/build-docx.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-docx:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install DOCX generator dependency
        run: python -m pip install --disable-pip-version-check python-docx

      - name: Build DOCX files
        run: python tools/build_docx.py

      - name: Upload DOCX artifact
        uses: actions/upload-artifact@v4
        with:
          name: technical-documentation-docx
          path: |
            docs/DOKUMENTACJA_TECHNICZNA_PL.docx
            docs/DOKUMENTACJA_TECHNICZNA_UA.docx

      - name: Commit generated DOCX files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/DOKUMENTACJA_TECHNICZNA_PL.docx docs/DOKUMENTACJA_TECHNICZNA_UA.docx
          if git diff --cached --quiet; then
            echo "DOCX files are already up to date."
            exit 0
          fi
          git commit -m "Build technical documentation DOCX [skip ci]"
          git push
