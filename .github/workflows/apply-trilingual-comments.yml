name: Apply trilingual source comments

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/apply-trilingual-comments.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run normalization script from temporary audit workflow
        run: |
          python -m pip install --disable-pip-version-check pyyaml
          python - <<'PY'
          from pathlib import Path
          import yaml
          data = yaml.safe_load(Path('.github/workflows/audit-comments.yml').read_text(encoding='utf-8'))
          steps = data['jobs']['normalize']['steps']
          script = next(step['run'] for step in steps if step.get('name') == 'Normalize source comments to PL EN UA')
          exec(compile(script, '<normalize-comments>', 'exec'))
          PY

      - name: Verify trilingual comment blocks
        run: |
          python - <<'PY'
          from pathlib import Path
          exts={'.cpp','.h','.hpp','.inc'}
          errors=[]
          for p in sorted(Path('src').rglob('*')):
              if p.suffix not in exts:
                  continue
              lines=p.read_text(encoding='utf-8').splitlines()
              i=0
              while i < len(lines):
                  if not lines[i].lstrip().startswith('//'):
                      i += 1
                      continue
                  start=i
                  block=[]
                  while i < len(lines) and lines[i].lstrip().startswith('//'):
                      block.append(lines[i])
                      i += 1
                  meaningful=[]
                  for line in block:
                      content=line.strip().lstrip('/').strip()
                      if content and set(content) != {'='}:
                          meaningful.append(line)
                  if not meaningful:
                      continue
                  text='\n'.join(block)
                  if not all(tag in text for tag in ('PL:','EN:','UA:')):
                      errors.append(f'{p}:{start+1}-{i}: missing PL/EN/UA')
          if errors:
              print('\n'.join(errors))
              raise SystemExit(1)
          print('All source comment blocks contain PL, EN and UA variants.')
          PY

      - name: Commit normalized comments and remove temporary workflows
        run: |
          rm .github/workflows/audit-comments.yml
          rm .github/workflows/apply-trilingual-comments.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src .github/workflows/audit-comments.yml .github/workflows/apply-trilingual-comments.yml
          git commit -m "Normalize source comments in Polish English and Ukrainian"
          git push
